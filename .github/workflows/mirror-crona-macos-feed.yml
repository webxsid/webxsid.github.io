name: Mirror Crona macOS feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the live appcast
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --location \
            "https://crona-app.github.io/crona-macos/appcast.xml" -o /tmp/appcast.xml; then
            echo "Live feed not published yet; nothing to copy."
            exit 0
          fi
          grep -q '<rss' /tmp/appcast.xml
          grep -Eq 'sparkle:edSignature=' /tmp/appcast.xml
          if cmp -s /tmp/appcast.xml crona-macos/appcast.xml; then
            echo "Feed unchanged."
            exit 0
          fi
          cp /tmp/appcast.xml crona-macos/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crona-macos/appcast.xml
          git commit -m "Mirror Crona macOS appcast"
          git push
